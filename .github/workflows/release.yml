# Stages @nasiq/lets on npm when a version tag is pushed, after the tests pass. It goes public only once a maintainer
# approves it on npmjs.com (or `npm stage approve`) with 2FA. Uses npm Trusted Publishing (OIDC): no npm token is
# stored, and provenance is attached.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'macOS'
        run: |  # the test fixtures use GNU sed
          brew install gnu-sed
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: scripts/check.sh
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm          # requires a maintainer's approval
    permissions:
      contents: read
      id-token: write         # npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", registry-url: "https://registry.npmjs.org"}
      - run: npm install -g npm@latest
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm stage publish --access public
