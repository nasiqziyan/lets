name: doctor
on: [push, pull_request]
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @fission-ai/openspec@1.15.0
      - run: bin/lets doctor
      - run: tests/run.sh
