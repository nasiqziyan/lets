# Monthly reminder with the work done: builds the upstream intake report and opens an issue with it.
# Then run the intake skill (scripts/intake-skill) in this repo to decide on each change; nothing is adopted without you.
name: intake
on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the report
        run: echo "REPORT=$(python3 scripts/maint.py intake report | tail -n 1)" >> "$GITHUB_ENV"
      - name: Open an issue with it
        run: gh issue create --title "Upstream intake $(date +%F)" --body-file "$REPORT"
        env:
          GH_TOKEN: ${{ github.token }}
